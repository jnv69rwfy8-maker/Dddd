<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="جامعتي">
<title>جامعتي — Personal Life OS</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1C1310">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@600;800&family=Dancing+Script:wght@700&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF1ED;--card:rgba(255,255,255,.78);--p:#A95C42;--p2:#C97A5E;--t:#1A110E;--m:#7a5f55;--bd:rgba(169,92,66,.28);--sh:0 8px 28px rgba(40,26,21,.08);--dk:rgba(250,241,237,.88);color-scheme:light}
:root[data-theme=dark]{--bg:#1C1310;--card:rgba(40,26,21,.62);--p:#D9886C;--p2:#A95C42;--t:#FDFBF7;--m:#b9a399;--sh:0 8px 28px rgba(0,0,0,.4);--dk:rgba(28,19,16,.85);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--t);font:16px/1.6 Cairo,Tahoma,sans-serif;background:radial-gradient(circle at 12% 0,rgba(217,136,108,.25),transparent 45%),radial-gradient(circle at 100% 45%,rgba(169,92,66,.2),transparent 40%),var(--bg);background-attachment:fixed;}
main{max-width:900px;margin:0 auto;padding:12px 14px 120px}
.top{display:flex;justify-content:space-between;align-items:center;direction:ltr;padding:4px 0}
.wm{display:flex;align-items:center;gap:8px;font:700 22px 'Dancing Script',cursive;color:var(--p)}
.wm svg{filter:drop-shadow(0 3px 8px rgba(169,92,66,.5))}
.sv{font-size:12px;color:var(--p);direction:rtl;opacity:.7;transition:.3s}
.hero{padding:6px 2px 14px}
.hero h1{font-size:28px;font-weight:800;margin:0;line-height:1.3}
#dt{color:var(--m);font-size:14px}
#app{display:grid;gap:14px}
@media(min-width:760px){#app{grid-template-columns:1fr 1fr;align-items:start}}
h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin:0 0 12px}
.ic{font-style:normal;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,rgba(217,136,108,.3),rgba(169,92,66,.15));border:1px solid var(--bd);font-size:20px}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;padding:16px;box-shadow:var(--sh)}
button,select{font:700 15px Cairo,sans-serif;border:1px solid var(--bd);background:rgba(169,92,66,.1);color:var(--t);border-radius:12px;padding:8px 14px;cursor:pointer}
button:active{transform:scale(.96)}
button.f{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;box-shadow:0 4px 14px rgba(169,92,66,.4)}
button.x{border:0;background:none;padding:4px 8px;color:var(--m)}
select{background:var(--bg);color:var(--t)}
input,textarea{font:16px Cairo,sans-serif;background:rgba(127,127,127,.1);color:var(--t);border:1px solid var(--bd);border-radius:12px;padding:9px 11px;min-width:0;flex:1;width:100%}
input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--p)}
input[type=range]{accent-color:var(--p);padding:0}
input[type=file]{font-size:13px}
textarea{min-height:90px;resize:vertical}
.r{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.r>input{width:auto;flex:1 1 90px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:13px;color:var(--m)}
.g>div{background:rgba(169,92,66,.1);border-radius:14px;padding:8px 2px}
.n{display:block;font:800 34px Inter,system-ui,sans-serif;color:var(--p);line-height:1.2}
.big{font:800 44px Inter,system-ui,sans-serif;text-align:center;color:var(--p);margin:6px 0}
.chip{display:inline-block;border:1px solid var(--bd);background:rgba(169,92,66,.08);border-radius:20px;padding:2px 11px;margin:3px;font-size:13px;font-family:Cairo,sans-serif;color:var(--t)}
.em{color:var(--m);text-align:center;font-size:14px}
small{color:var(--m)}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px;text-align:center}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars i{display:block;width:100%;background:linear-gradient(var(--p),var(--p2));border-radius:8px 8px 0 0;min-height:3px}
.fi{display:inline-block;position:relative;margin:4px}
.fi img,.fi video{width:100px;height:100px;object-fit:cover;border-radius:12px}
.fi button{position:absolute;top:0;left:0;background:var(--bg);padding:2px 6px}
#clk,#sm{position:fixed;inset:0;display:none;z-index:30;align-items:center;justify-content:center;flex-direction:column;background:#000;color:#fff;direction:ltr}
#sm{background:var(--bg);color:var(--t);direction:rtl;gap:10px}
.fl{display:flex;gap:6px;align-items:center}
.fl span{font:800 22vw/1 Inter,sans-serif;background:#222;border-radius:14px;padding:2vw}
.fl em{font-size:12vw}
.oled{font:800 26vw Inter,sans-serif}
#toast{position:fixed;bottom:110px;inset-inline:20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:10px;border-radius:14px;text-align:center;display:none;z-index:40}
.beam{height:10px;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:5px;transition:transform .5s;margin:30px 0}
canvas{width:100%;height:100px;display:block}
#dock{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));inset-inline:12px;max-width:520px;margin:0 auto;display:flex;gap:4px;padding:7px;border-radius:26px;background:var(--dk);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:var(--sh);z-index:20}
#dock button{flex:1;border:0;background:none;border-radius:19px;display:flex;flex-direction:column;align-items:center;padding:5px 2px;color:var(--m);font-size:11px;line-height:1.3;box-shadow:none}
#dock button span{font-size:22px}
#dock button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#sc{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top)}
.hero h1{font:700 32px/1.5 'Aref Ruqaa',Cairo,serif;color:var(--t);text-shadow:0 2px 14px rgba(217,136,108,.35)}
h2,#dock button,summary{font-family:'Reem Kufi',Cairo,sans-serif}
h2{font-weight:700;font-size:20px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.card{position:relative}
.card::before{content:'✦';position:absolute;top:8px;left:14px;color:var(--p);opacity:.35;font-size:13px}
.orn{display:flex;align-items:center;gap:10px;color:var(--p);margin:6px 0 2px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--p),transparent)}
.noo .orn,.noo .card::before,.noo h2::after{display:none}
.nb .card,.nb #dock{backdrop-filter:none;-webkit-backdrop-filter:none}
details{border:1px solid var(--bd);border-radius:14px;margin:8px 0;padding:4px 12px;background:rgba(169,92,66,.05)}
summary{font-weight:700;font-size:16px;cursor:pointer;padding:8px 0}
#dt div{line-height:1.7}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tiles>div{background:rgba(169,92,66,.1);border:1px solid var(--bd);border-radius:16px;padding:10px 6px;text-align:center;font-size:13px;line-height:1.4;color:var(--m)}
.tiles i{font-style:normal;display:block;font-size:20px}
.tiles b{display:block;font:800 28px Inter,system-ui,sans-serif;color:var(--p)}
.cc{display:flex;align-items:center;gap:14px}
.ccs{flex:1;display:grid;gap:6px}
.ccs>div{background:rgba(169,92,66,.1);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--m);display:flex;align-items:center;gap:8px}
.ccs b{font:800 22px Inter,system-ui,sans-serif;color:var(--p);min-width:30px}
.nx{margin:6px 0 10px;padding:10px;border-radius:14px;border:1px dashed var(--bd)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tip{color:var(--m);font-size:14px;margin:10px 0 0}
.chip.on{background:var(--p);color:#fff}
.bars{gap:3px}.bars div{min-width:0}.bars small{font-size:10px;white-space:nowrap}.bars .dn{font-size:10.5px}
.fl.sm span{font-size:13vw;padding:1.5vw}.fl.sm em{font-size:8vw}
</style></head><body>
<div id="sc"><main>
<div class="top"><div class="wm"><span id="lg"></span><span id="wmn">✦ Mohamed Salah ✦</span></div><div class="r" style="margin:0"><span class="sv" id="svb">✓ تم الحفظ تلقائياً</span><button onclick="thm()">🌓</button></div></div>
<div class="hero"><h1 id="gr"></h1><div id="dt"></div><div class="orn">❖</div></div>
<div id="app"></div>
</main></div><nav id="dock"></nav>
<div id="clk"></div><div id="sm"></div><div id="toast"></div>
<script>
const K='jlos',lk=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),T=lk(new Date()),$=s=>document.querySelector(s),v=id=>(document.getElementById(id)||{}).value||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({tasks:[],lect:[],budget:3000,exp:[],pomo:{},focus:{},xp:0,coffee:{},mood:{},water:{},supp:{},people:[],ideas:[],subs:[],wallet:[],team:[],chal:[],prio:[],pin:'',theme:'dark',nt:'',ex:[],pf:25,hab:[],nm:'محمد',wm:'Mohamed Salah',acc:'',zm:1,orn:1,blur:1,snd:1,vib:1,pb:5,wg:3000,wz:250,mps:2,mtr:5,mw:3,hij:1,gdt:1,gl:1,hid:{}},S);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
const idb=()=>new Promise((r,j)=>{try{const q=indexedDB.open('jlos',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>j()}catch(e){j()}});
async function dbp(o){try{const d=await idb();return await new Promise(r=>{const q=o(d.transaction('f','readwrite').objectStore('f'));q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
let snT=0;
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}const b=$('#svb');if(b){b.style.opacity=1;setTimeout(()=>b.style.opacity=.6,900)}clearTimeout(snT);snT=setTimeout(()=>dbp(t=>t.put({id:'snap',k:'snap',data:JSON.stringify(S)})),3000)}
function up(k){const e=document.getElementById('b'+k);if(e)e.innerHTML=C[k][2]()}
function sv(k){save();up(k);if(k!=1)up(1)}
function ntfAsk(){if(!window.Notification)return toast('المتصفح لا يدعم الإشعارات');Notification.requestPermission().then(p=>toast(p=='granted'?'تم تفعيل الإشعارات ✅':'الإشعارات معطّلة'))}
function ntf(t){try{if(window.Notification&&Notification.permission=='granted')new Notification('جامعتي',{body:t})}catch(e){}}
function beep(){if(S.snd===0)return;try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},400)}catch(e){}}
function thm(){S.theme=S.theme=='dark'?'light':'dark';cfg();save()}
function cp(t){try{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ ✅'),fb)}catch(e){fb()}function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('تم النسخ ✅')}catch(e){}a.remove()}}
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click()}
const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const mon=T.slice(0,7),rem=()=>S.budget-S.exp.filter(e=>e.d.slice(0,7)==mon).reduce((a,b)=>a+b.a,0);
const dim=()=>{const d=new Date();return[new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),d.getDate()]};
const C={};
function dAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d}
function dts(d){return[d.toLocaleDateString('ar-EG-u-ca-gregory',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' م',d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'})]}
const PT=['مراجعة ما درسته اليوم','حل الواجبات المطلوبة','تحضير حقيبة الغد','ممارسة الرياضة','ترتيب الغرفة والمكتب','قراءة عشرين صفحة','مراجعة المصروفات','التواصل مع الأهل','تنظيم جدول الغد','النوم مبكراً'];
function tk(i,c){const t=S.tasks[i];t.d=c;if(c&&!t.x){t.x=1;S.xp+=5;toast('+5 XP 🔥')}sv(25)}
function streak(){let n=0;for(let i=0;i<400;i++){const k=lk(dAgo(i));if((S.focus[k]||0)>0)n++;else if(i>0)break}return n}
const TR=['الشهداء','السادات','العتبة','جمال عبد الناصر'];
// 1 command
function goQ(p,f){show(p);setTimeout(()=>{const e=$('#'+f);e&&e.focus()},60)}
C[1]=['h','🧭 مركز القيادة',()=>{const o=S.tasks.filter(t=>!t.d),dn=S.tasks.length-o.length,pc=S.tasks.length?Math.round(dn/S.tasks.length*100):0,od=o.filter(t=>t.due&&t.due<T).length,nx=o.slice().sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1)[0],fc=S.pomo[T]||0,ex=S.ex.map(e=>Math.ceil((new Date(e.d)-new Date(T))/864e5)).filter(d=>d>=0).sort((a,b)=>a-b)[0],R=rem(),hr=new Date().getHours(),cr=2*Math.PI*52;
const tip=od?`لديك ${od} مهمة متأخرة، فابدأ بأقدمها.`:S.tasks.length&&!o.length?'أنجزت جميع مهامك، أحسنت! 🎉':!fc&&hr>=9&&hr<22?'لم تبدأ جلسة تركيز اليوم، وجلسة واحدة تكفي للانطلاق.':R<S.budget*.1?'اقتربت ميزانية الشهر من النفاد، فاقتصد.':'يوم موفّق، حدّد أهم مهمة وابدأ بها.';
return `<div class=cc><svg viewBox="0 0 120 120" width=124 height=124><circle cx=60 cy=60 r=52 fill=none stroke="rgba(169,92,66,.2)" stroke-width=10 /><circle cx=60 cy=60 r=52 fill=none stroke="var(--p)" stroke-width=10 stroke-linecap=round stroke-dasharray="${pc/100*cr} ${cr}" transform="rotate(-90 60 60)"/><text x=60 y=67 text-anchor=middle font-size=26 font-weight=800 font-family=Inter fill="currentColor">${pc}%</text></svg><div class=ccs><div><b>${o.length}</b>مهام متبقية</div><div><b>${dn}</b>مهام منجزة</div><div><b style="${od?'color:#e53935':''}">${od}</b>مهام متأخرة</div></div></div>
<div class=tiles><div><i>⏱</i><b>${fc}</b>جلسات تركيز اليوم</div><div><i>🔥</i><b>${streak()}</b>أيام تركيز متتالية</div><div><i>💸</i><b>${R}</b>المتبقي من الميزانية (ج)</div><div><i>📝</i><b>${ex===undefined?'—':ex}</b>${ex===undefined?'لا امتحانات مسجّلة':'يوماً على أقرب امتحان'}</div></div>
<div class=nx>📌 ${nx?'الأقرب: <b>'+esc(nx.n)+'</b>'+(nx.due?' <small>'+nx.due+'</small>':''):'لا توجد مهام معلّقة'}</div>
<div class=qa><button class=f onclick="goQ('h','tn')">＋ مهمة جديدة</button><button class=f onclick="pGo()">${pm.r?'⏸ إيقاف التركيز':'▶ ابدأ التركيز'}</button><button onclick="goQ('m','ea')">💸 تسجيل مصروف</button><button onclick="goQ('s','ie')">💡 فكرة سريعة</button></div><p class=tip>💬 ${tip}</p>`}];
C[25]=['h','📋 مهام اليوم',()=>`${S.tasks.length?'':'<p class=em>لا توجد مهام بعد — أضف أولى مهامك 👇</p>'}${S.tasks.map((t,i)=>`<div class=r><label style="flex:1"><input type=checkbox ${t.d?'checked':''} onchange="tk(${i},this.checked)"> ${esc(t.n)} <small>${t.due||''}</small></label><button class=x onclick="S.tasks.splice(${i},1);sv(25)">✕</button></div>`).join('')}<div class=em>مهام جاهزة — المس لإضافتها</div><div>${PT.map((t,i)=>S.tasks.some(x=>x.n==t)?'':`<span class=chip onclick="S.tasks.push({n:PT[${i}],due:'',d:0});sv(25)">＋ ${t}</span>`).join('')}</div><div class=r><input id=tn placeholder="مهمة جديدة"><input id=td type=date><button class=f onclick="if(v('tn')){S.tasks.push({n:v('tn'),due:v('td'),d:0});sv(25)}">＋</button></div>`];
// 2 pomodoro
let pm={l:(S.pf||25)*60,r:0,b:0,i:0};
function pTick(){pm.l--;const e=$('#pt');if(e)e.textContent=fm(pm.l);if(pm.l<=0){clearInterval(pm.i);pm.r=0;if(!pm.b){S.pomo[T]=(S.pomo[T]||0)+1;S.focus[T]=(S.focus[T]||0)+(S.pf||25);S.xp+=10}beep();S.vib!==0&&navigator.vibrate&&navigator.vibrate([300,100,300]);ntf(pm.b?'انتهت الراحة ⚡':'انتهت جلسة التركيز 🎯');pm.b=!pm.b;pm.l=pm.b?(S.pb||5)*60:(S.pf||25)*60;sv(2)}}
function pGo(){if(pm.r){clearInterval(pm.i);pm.r=0}else{pm.r=1;pm.i=setInterval(pTick,1000)}up(2);up(1)}
function pRs(){clearInterval(pm.i);pm={l:(S.pf||25)*60,r:0,b:0,i:0};up(2)}
C[2]=['h','⏱ جلسات التركيز',()=>`<div class=big id=pt style="font-size:64px">${fm(pm.l)}</div><p style="text-align:center">${pm.b?'☕ راحة':'🎯 تركيز'} — جلسات اليوم: <b>${S.pomo[T]||0}</b></p><div class=r style="justify-content:center"><button class=f onclick="pGo()">${pm.r?'⏸ إيقاف':'▶ ابدأ'}</button><button onclick="pRs()">↺ إعادة</button></div><div class=r style="justify-content:center">${[15,25,45,50].map(m=>`<button class="${(S.pf||25)==m?'f':''}" onclick="S.pf=${m};pRs();save()">${m}د</button>`).join('')}</div>`];
// 3 analytics
C[3]=['s','📊 مرصد الإنتاجية',()=>{const nm=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],ds=[...Array(7)].map((_,i)=>dAgo(6-i)),vals=ds.map(d=>S.focus[lk(d)]||0),mx=Math.max(...vals,1),tot=vals.reduce((a,b)=>a+b,0),bi=vals.indexOf(Math.max(...vals)),od=S.tasks.filter(t=>!t.d&&t.due&&t.due<T).length;
return `<div class=bars>${vals.map((x,i)=>`<div><small>${x}</small><i style="height:${Math.max(3,x/mx*80)}px"></i><small class=dn>${nm[ds[i].getDay()]}</small></div>`).join('')}</div><small>الأعمدة تمثّل دقائق التركيز في آخر ٧ أيام.</small><div class=tiles><div><i>🏆</i><b style="font-size:22px">${tot?nm[ds[bi].getDay()]:'—'}</b>أكثر يوم إنجازاً</div><div><i>⏳</i><b>${Math.round(tot/7)}</b>متوسط دقائق التركيز يومياً</div><div><i>📚</i><b>${(tot/60).toFixed(1)}</b>ساعات الدراسة هذا الأسبوع</div><div><i>⚠️</i><b style="${od?'color:#e53935':''}">${od}</b>المهام المتأخرة</div></div>`}];
